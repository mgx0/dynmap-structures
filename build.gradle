import org.apache.tools.ant.filters.ReplaceTokens

plugins {
  id 'java'
  id 'eclipse'
  id 'idea'
  id 'com.gradleup.shadow' version '9.2.2'
}

group = 'com.kovuthehusky'
version = '2.7.0'
java {
  sourceCompatibility = JavaVersion.VERSION_25
}

processResources {
  filesNotMatching("**/*.png") {
    filter ReplaceTokens, tokens: [
      "version": project.property("version")
    ]
  }
}

dependencies {
  def minecraftApi = "org.spigotmc:spigot-api:${providers.gradleProperty('minecraftApi').getOrElse('26.2-R0.1-SNAPSHOT')}"
  compileOnly minecraftApi
  implementation 'org.bstats:bstats-bukkit:3.0.3'
  compileOnly 'org.dynmap:DynmapCoreAPI:1.9.4'
  testImplementation minecraftApi
  testImplementation 'org.dynmap:DynmapCoreAPI:1.9.4'
  testImplementation platform('org.junit:junit-bom:5.13.4')
  testImplementation 'org.junit.jupiter:junit-jupiter'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
  testImplementation 'org.mockito:mockito-core:5.20.0'
}

test {
  useJUnitPlatform()
}

repositories {
  mavenCentral()
  maven { url 'https://hub.spigotmc.org/nexus/content/groups/public/' }
  maven { url 'https://repo.mikeprimm.com/' }
}

shadowJar {
  dependencies {
    include(dependency('org.bstats:.*:.*'))
  }
  relocate 'org.bstats', 'com.kovuthehusky.bstats'
}

jar.finalizedBy(shadowJar);
